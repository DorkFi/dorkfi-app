[build]
builder = "RAILPACK"
# Share server only. The Vite build OOMs on Railway and is published separately.
buildCommand = "echo 'Skipping frontend build; share server only'"

[deploy]
startCommand = "npm run start:share-server"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
